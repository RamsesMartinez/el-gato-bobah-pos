root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql"]
  # OJO: no excluir internal/store/db — es el código generado por sqlc; si se excluye,
  # regenerar queries no dispara rebuild y el server sirve un binario viejo (bug silencioso).
  exclude_dir = ["tmp"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
