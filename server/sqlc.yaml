version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          # ponytail: numeric → float64 en todo el backend. Simplifica costeo/menú/órdenes.
          # Ceiling: para dinero se redondea a 2 decimales en cada frontera (money.Round2);
          # si la exactitud al centavo llega a fallar, migrar a centavos int64.
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "user_role"
            go_type: "string"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
