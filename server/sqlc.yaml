version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    # `sqlc vet` prepara CADA query contra una Postgres real con el esquema ya migrado (regla
    # db-prepare) → atrapa el drift esquema↔query que la generación no ve (p. ej. una columna
    # inexistente en el WHERE, como el `where id = true` que llegó a prod). La URI viene de
    # SQLC_DB_URI (la fija `make sqlc-vet` / CI). analyzer.database:false → `sqlc generate` NO
    # toca la DB (sigue siendo estático y offline); solo `vet` la usa.
    database:
      uri: "${SQLC_DB_URI}"
    rules:
      - sqlc/db-prepare
    analyzer:
      database: false
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          # numeric → decimal.Decimal exacto (dinero/costos/cantidades). Postgres numeric ya es
          # exacto; el bug era escanearlo a float64. Escaneo vía pgx-shopspring-decimal (store.go).
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          # numeric NULABLE → *decimal.Decimal. Sin esto sqlc cae a pgtype.Numeric, que obliga a
          # reconstruir el decimal a mano en cada lectura (y ahí es donde se cuela un float64).
          # Importa donde el NULL significa algo distinto de 0: qty_received null = "no recibido",
          # 0 = "no llegó".
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          - db_type: "numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "user_role"
            go_type: "string"
          # uuid de la stdlib (Go 1.27): mismo [16]byte que google/uuid, una dependencia menos
          # en el supply chain. pgx lo encodea por su codec de uuid igual que antes.
          - db_type: "uuid"
            go_type:
              import: "uuid"
              type: "UUID"
          # uuid NULABLE → *uuid.UUID, mismo criterio que el numeric de arriba: sin esto sqlc cae a
          # pgtype.UUID y la llave de idempotencia del cobro se lee distinto que la de la creación,
          # que sí es not null. Dos representaciones del mismo dato en el mismo flujo.
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "uuid"
              type: "UUID"
              pointer: true
