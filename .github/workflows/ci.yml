name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Menor privilegio (A08): todos los jobs son read-only (build/test/lint/scan). Sin esto el
# GITHUB_TOKEN toma el scope por defecto del repo, que puede ser de escritura.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Actions clavadas por SHA (A08): un tag mutable puede reapuntarse a código malicioso.
      # Dependabot (github-actions) mantiene estos pines al día.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Lint (golangci-lint + gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # action v7+ soporta golangci-lint v2; la versión del linter debe estar compilada
          # con Go >= el go directive del go.mod (1.25.7) o falla el self-check. Versión pinada
          # (no `latest`): una release nueva no debe romper CI sin revisión. Dependabot no
          # rastrea inputs `with:`, así que se sube a mano.
          version: v2.12.2
          working-directory: server
      - name: Vulnerabilities (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # Digest-pin (A08). Dependabot (docker) no rastrea services:, se sube a mano.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gatobobah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gatobobah_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Flujos que solo se pueden probar contra un Postgres real (reuso de refresh, tx de
      # orden + depleción, reembolso). El esquema se recrea por test desde las migraciones.
      - name: Integration tests
        run: go test -tags=integration ./internal/integration/...
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/gatobobah_test?sslmode=disable

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7 # pinado (no `latest`): reproducible y a la par del lockfile
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      # Bloqueante en high/critical (A06): antes `|| true` lo hacía informativo. El umbral
      # high evita que un aviso low/moderate rompa CI mientras se triagea.
      - name: Audit
        run: bun audit --audit-level=high
