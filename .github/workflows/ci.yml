name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Actions clavadas por SHA (A08): un tag mutable puede reapuntarse a código malicioso.
      # Dependabot (github-actions) mantiene estos pines al día.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Lint (golangci-lint + gosec)
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest
          working-directory: server
      - name: Vulnerabilities (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      # Bloqueante en high/critical (A06): antes `|| true` lo hacía informativo. El umbral
      # high evita que un aviso low/moderate rompa CI mientras se triagea.
      - name: Audit
        run: bun audit --audit-level=high
