name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Menor privilegio (A08): todos los jobs son read-only (build/test/lint/scan). Sin esto el
# GITHUB_TOKEN toma el scope por defecto del repo, que puede ser de escritura.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Actions clavadas por SHA (A08): un tag mutable puede reapuntarse a código malicioso.
      # Dependabot (github-actions) mantiene estos pines al día.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Lint (golangci-lint + gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # action v7+ soporta golangci-lint v2; la versión del linter debe estar compilada
          # con Go >= el go directive del go.mod (1.27.0) o falla el self-check. Verifícalo con
          # `go version $(which golangci-lint)` — v2.13.1 es go1.27.0. Versión pinada (no
          # `latest`): una release nueva no debe romper CI sin revisión. Dependabot no rastrea
          # inputs `with:`, así que se sube a mano.
          version: v2.13.1
          working-directory: server
      - name: Vulnerabilities (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          work-dir: server
          go-version-file: server/go.mod

  integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # Digest-pin (A08). Dependabot (docker) no rastrea services:, se sube a mano.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gatobobah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d gatobobah_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        # Digest-pin (A08). Dependabot (docker) no rastrea services:, se sube a mano.
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Compilar sqlc desde fuente cuesta ~60s y da SIEMPRE el mismo binario para una versión
      # dada: se cachea por versión + sistema. En un miss cuesta lo de antes, nunca más.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-sqlc
        with:
          path: ~/go/bin/sqlc
          key: sqlc-v1.31.1-${{ runner.os }}-${{ runner.arch }}
      # sqlc pinado (misma versión que el Makefile → codegen reproducible local/CI).
      - name: Instalar sqlc
        if: steps.cache-sqlc.outputs.cache-hit != 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: sqlc al PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Esta base se tira entera al terminar el job: pagar durabilidad por cada escritura es
      # comprar una garantía que nadie va a cobrar. NO se toca el Postgres de producción, solo el
      # del runner. Medido sobre la suite completa: 447.8 s → 312.3 s por sí solo, y 52.3 s →
      # 44.5 s ya con la plantilla (lo que quedaba por ahorrar era menos, porque las migraciones
      # por prueba eran justo lo que más fsync pedía).
      #
      # Va por `alter system` y no por la línea de comandos del contenedor porque `services:` de
      # Actions no acepta `command:`; los tres parámetros son de contexto sighup, así que un
      # reload basta y no hace falta reiniciar.
      - name: Postgres sin durabilidad (es una base desechable)
        run: |
          psql "$DATABASE_URL" \
            -c "alter system set fsync = off" \
            -c "alter system set full_page_writes = off" \
            -c "alter system set synchronous_commit = off" \
            -c "select pg_reload_conf()"
          # Verifica en una conexión NUEVA: el reload no cambia la sesión que lo pidió, así que
          # comprobarlo ahí daría 'on' y haría creer que no sirvió. Y si un día el runner se queda
          # sin psql, esto falla ruidoso en vez de dejar la suite lenta sin que nadie lo note.
          test "$(psql "$DATABASE_URL" -tAc 'show fsync')" = off
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/gatobobah_test?sslmode=disable
      # El código generado debe estar al día (nadie olvidó `make sqlc` tras tocar una query).
      - name: sqlc al día (sqlc diff)
        run: sqlc diff
      # Carga el esquema (migraciones embebidas) para que `sqlc vet` prepare contra la DB real.
      - name: Cargar esquema (migraciones)
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/gatobobah_test?sslmode=disable
      # db-prepare: PREPARA cada query contra el esquema real → atrapa el drift esquema↔query
      # (columna inexistente en el WHERE, tipos, SQL inválido) que la generación no ve. Gatea el
      # deploy (deploy-backend needs [integration]).
      - name: sqlc vet (db-prepare)
        run: sqlc vet
        env:
          SQLC_DB_URI: postgres://test:test@localhost:5432/gatobobah_test?sslmode=disable
      # Flujos que solo se pueden probar contra un Postgres/Redis real (reuso de refresh, tx de
      # orden + depleción, reembolso, rate limiter compartido entre "réplicas").
      - name: Integration tests
        # -timeout 10m contra ~45 s medidos: el margen es para un cuelgue, no para crecer dentro.
        # Bajado de 30m el 2026-09-16 al dejar de correr las migraciones por prueba.
        #
        # DÓNDE SE VA EL TIEMPO, para que el siguiente que lo mueva sepa qué está comprando: la
        # suite llama `newTestStore` ~364 veces y cada llamada CLONA una plantilla ya migrada
        # (~30 ms), en vez de correr las 71 migraciones (~770 ms) como hasta el 2026-09-16. Medido
        # sobre la suite completa: 447.8 s → 44.5 s, con el `fsync=off` de arriba. Si esto vuelve a
        # crecer, lo que creció es el CUERPO de las pruebas, no su preparación: ahí sí aplica que
        # una prueba que solo mira una restricción comparta esquema con subpruebas, como hace
        # `TestLasRestriccionesDelEsquemaDeMenus`.
        run: go test -timeout 10m -tags=integration ./internal/integration/... ./internal/httpapi/...
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/gatobobah_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7 # pinado (no `latest`): reproducible y a la par del lockfile
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      # La consola de plataforma se revisa en pasos APARTE (spec 016): su typecheck y su build son
      # otro proyecto, y el punto de separarlos es que un error suyo se vea como suyo y no como una
      # falla del POS. Van después a propósito — si el POS está roto, eso se lee primero.
      - name: Typecheck (consola)
        run: bun run typecheck:consola
      - name: Build (consola)
        run: bun run build:consola
      # Bloqueante en high/critical (A06): antes `|| true` lo hacía informativo. El umbral
      # high evita que un aviso low/moderate rompa CI mientras se triagea.
      - name: Audit
        run: bun audit --audit-level=high

  # --- Deploy (solo push directo a main, nunca en PRs) ---
  # El front sale DESPUÉS del backend, a propósito.
  #
  # Antes dependía solo de `frontend` mientras el backend esperaba a `image` (que a su vez espera a
  # las pruebas de integración): el front llegaba a producción unos siete minutos antes. En esa
  # ventana el POS ya pide campos que el backend viejo no manda y ofrece caminos que todavía no
  # existen — se puede crear un pedido y no poder cobrarlo.
  #
  # Al revés es seguro: los cambios de backend son aditivos, así que un front viejo contra un backend
  # nuevo simplemente ignora lo que no conoce. Y si el deploy del backend falla, el front NO sale:
  # quedarse con los dos viejos es coherente; quedarse con el front nuevo solo, no.
  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    needs: [frontend, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Versión (SHA corto para el pie de sistema)
        run: echo "APP_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build
        run: bun run build
        env:
          # El frontend vive en Cloudflare Pages, la API en su propio subdominio (VM) — ya
          # no es mismo origen, ver web/src/api/client.ts.
          VITE_API_URL: https://api.elgatobobah.com/api/v1
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      # Direct Upload (no hay integración Git nativa de Cloudflare Pages conectada): el propio
      # Action sube el build ya compilado. Sin action de terceros — wrangler ya es dependencia
      # del proyecto, se invoca directo.
      - name: Deploy a Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=el-gato-bobah-pos --branch=develop --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e276d7cc7e74941f3843e3dd677cc748

  deploy-frontend-staging:
    name: Deploy frontend (ambiente de pruebas)
    # Mismo orden que en producción: el ambiente de pruebas no sirve para ensayar un deploy si su
    # secuencia no es la que va a correr de verdad.
    needs: [frontend, deploy-staging]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Versión (SHA corto para el pie de sistema)
        run: echo "APP_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build
        run: bun run build
        env:
          # Lo único que cambia contra el build de producción: a qué API le pega. Si esto
          # apuntara a la API de producción, el ambiente de pruebas escribiría en el negocio.
          VITE_API_URL: https://api-dev.elgatobobah.com/api/v1
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
      # Proyecto de Pages PROPIO del ambiente de pruebas, no una preview del de producción. Una
      # preview no puede tener dominio propio —en Pages el dominio propio siempre sirve el deploy
      # de producción del proyecto— así que app-dev necesitaba su proyecto. `--branch=staging` es
      # la rama de producción de ESTE proyecto: es lo que app-dev.elgatobobah.com entrega.
      # El CSP de web/public/_headers lista la API de PRODUCCIÓN en connect-src. Sin esto, el front
      # de pruebas se construye apuntando a api-dev y el navegador le bloquea el login con
      # "Refused to connect because it violates the document's Content Security Policy" — que fue
      # exactamente lo que pasó.
      #
      # Se reescribe aquí y no se agregan los dos dominios al archivo: el CSP de producción debe
      # listar solo lo que producción necesita. Lo que cambia entre ambientes es el host de la API,
      # no la FORMA de la política, así que el ambiente de pruebas sigue probando el mismo CSP.
      - name: Apuntar el CSP a la API de pruebas
        run: |
          sed -i 's|https://api\.elgatobobah\.com|https://api-dev.elgatobobah.com|g' dist/_headers
          # Falla ruidoso si el sed no encontró nada: un rename del dominio dejaría el CSP viejo y
          # el login volvería a romperse en silencio hasta que alguien lo probara a mano.
          grep -q 'connect-src .*https://api-dev\.elgatobobah\.com' dist/_headers
          ! grep -q 'https://api\.elgatobobah\.com' dist/_headers

      - name: Deploy a Cloudflare Pages (ambiente de pruebas)
        run: bunx wrangler pages deploy dist --project-name=el-gato-bobah-pos-dev --branch=staging --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e276d7cc7e74941f3843e3dd677cc748

  # --- La consola de plataforma (spec 016): otro build, otro proyecto de Pages, otro dominio. ---
  #
  # Jobs propios y NO pasos dentro de los del POS: lo que se despliega al mostrador no puede quedar
  # varado porque falle la subida de una consola que usa una persona. Si el POS sale y la consola
  # no, el negocio sigue cobrando.
  deploy-consola:
    name: Deploy consola (Cloudflare Pages)
    needs: [frontend, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build:consola
        env:
          VITE_API_URL: https://api.elgatobobah.com/api/v1
      - name: Deploy a Cloudflare Pages
        run: bunx wrangler pages deploy dist-consola --project-name=el-gato-bobah-pos-consola --branch=develop --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e276d7cc7e74941f3843e3dd677cc748

  deploy-consola-staging:
    name: Deploy consola (ambiente de pruebas)
    needs: [frontend, deploy-staging]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build:consola
        env:
          VITE_API_URL: https://api-dev.elgatobobah.com/api/v1
      # Misma reescritura del CSP que el POS y por la misma razón: `public-consola/_headers` lista
      # la API de PRODUCCIÓN, porque el CSP de producción debe listar solo lo que producción
      # necesita. Falla ruidoso si el sed no encontró nada.
      - name: Apuntar el CSP a la API de pruebas
        run: |
          sed -i 's|https://api\.elgatobobah\.com|https://api-dev.elgatobobah.com|g' dist-consola/_headers
          grep -q 'connect-src .*https://api-dev\.elgatobobah\.com' dist-consola/_headers
          ! grep -q 'https://api\.elgatobobah\.com' dist-consola/_headers

      - name: Deploy a Cloudflare Pages (ambiente de pruebas)
        run: bunx wrangler pages deploy dist-consola --project-name=el-gato-bobah-pos-consola-dev --branch=staging --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e276d7cc7e74941f3843e3dd677cc748

  # La imagen se compila AQUÍ, no en el VPS. La VM es un e2-micro (1 vCPU, 1 GB): compilar
  # el módulo ahí tarda ~30 min con la caché caliente y arriesga OOM justo cuando el runner
  # de Go cambia de versión (la subida a 1.27 invalidó todas las capas). El runner de Actions
  # es gratis e ilimitado en repos públicos, así que el build vive aquí y el VPS solo baja.
  image:
    name: Build imagen API (ghcr.io)
    # Construir la imagen no necesita que las pruebas de integración hayan pasado: lo que tiene
    # que estar gateado por ellas es el DESPLIEGUE, y eso lo imponen los `needs` de los jobs de
    # deploy. Con esto el minuto del docker build corre EN PARALELO con la suite en vez de después.
    #
    # Lo que SÍ cambia, y hay que saberlo: con la suite en rojo el tag móvil `:develop` queda
    # apuntando a una imagen que no pasó las pruebas. Ningún deploy la toma —para eso están los
    # `needs` de abajo—, pero quien levante a mano con `:develop` ya no puede suponer que lo que
    # baja está verde. El tag con SHA no tiene ese problema: identifica un commit, no "lo último".
    needs: [backend]
    # Las DOS ramas: main alimenta producción y develop el ambiente de pruebas. Sin construir en
    # develop, api-dev se quedaría corriendo la imagen de producción y no probaría nada.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar en ghcr.io; el resto del workflow sigue read-only
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN del propio workflow: no hace falta un PAT ni federación con GCP para
          # publicar en ghcr.io, y el paquete público se baja sin credenciales.
          password: ${{ secrets.GITHUB_TOKEN }}
      # El tag lleva el SHA del commit: el deploy referencia una imagen EXACTA en vez de un
      # tag móvil, así que reintentar un deploy vuelve a poner el mismo binario.
      - name: Etiquetas
        id: meta
        run: |
          # ghcr.io EXIGE minúsculas y el owner es "RamsesMartinez": sin el tr el push falla.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}/api:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # El tag móvil lleva el nombre de la rama: :main y :develop conviven sin pisarse.
          echo "moving=ghcr.io/${repo}/api:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          # El VPS es amd64; sin fijarlo buildx toma la del runner y coincide por casualidad.
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.moving }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          # Caché de capas entre corridas: sin esto cada push recompila el módulo entero.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy backend (ambiente de pruebas)
    # `integration` va aquí, no en `image`: el gate es del despliegue.
    needs: [image, integration]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-vps-dev
      cancel-in-progress: false
    steps:
      # Misma llave que producción: las SSH keys son metadata del PROYECTO en GCP, así que el
      # mismo usuario alcanza las dos VMs sin secreto nuevo.
      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          API_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.61.175.194 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key ramses_mtz96@34.61.175.194             "cd el-gato-bobah-pos && git fetch origin --prune && git checkout -B develop origin/develop && API_IMAGE='$API_IMAGE' make deploy-image"
      # La VM es spot: Google puede haberla reclamado entre dos pushes. Si no responde, el deploy
      # falla ruidoso en vez de dejar creer que se probó algo.
      - name: Verifica que la API de pruebas quedó arriba
        run: |
          # Sondea de inmediato y espera poco al principio: la API suele estar arriba en
          # segundos, y dormir 10s antes del primer intento los regalaba siempre.
          for i in $(seq 1 60); do
            if curl -fsS -m 10 https://api-dev.elgatobobah.com/readyz | grep -q ready; then
              echo "API de pruebas lista"; exit 0
            fi
            sleep 5
          done
          echo "api-dev no respondió /readyz tras 5 min (¿la VM spot está apagada? /ambiente-dev on)"; exit 1

  deploy-backend:
    name: Deploy backend (VPS)
    # `integration` va aquí, no en `image`: el gate es del despliegue.
    needs: [image, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Dos deploys simultáneos correrían `compose up` a la vez sobre la misma VM. Se encola en
    # vez de cancelar: cancelar a media substitución de contenedor deja la API abajo.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      # SSH directo (sin action de terceros): la VM ya acepta esta key vía metadata del
      # proyecto GCP. Ya no compila nada: baja la imagen que publicó el job anterior y
      # levanta. El checkout sigue haciendo falta porque el compose y el .env viven ahí.
      #
      # `fetch` + `checkout -B` y NO `git pull`, porque `pull` depende del estado en que quedó la
      # VM. El 2026-09-19 el deploy a producción murió con «Need to specify how to reconcile
      # divergent branches»: la rama local de la VM había divergido de origin y git se negó a
      # adivinar. No rompió nada —falló ANTES de tocar la imagen, y el front y la consola quedaron
      # en `skipped` por sus `needs`— pero dejó el release detenido sin que nada más lo dijera.
      #
      # Con esto la VM queda EXACTA a la rama, venga de donde venga: el deploy deja de depender de
      # su historia. Lo que se descarta es cualquier cambio versionado hecho a mano dentro de la
      # VM, que es justo lo que no debe existir en producción; `deploy/.env` no está versionado y
      # sobrevive.
      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          API_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.68.178.107 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key ramses_mtz96@34.68.178.107 \
            "cd el-gato-bobah-pos && git fetch origin --prune && git checkout -B main origin/main && API_IMAGE='$API_IMAGE' make deploy-image"
      # Un deploy que deja la API caída y nadie se entera es peor que uno que falla ruidoso.
      - name: Verifica que la API quedó arriba
        run: |
          # Sondea de inmediato y espera poco al principio: la API suele estar arriba en
          # segundos, y dormir 10s antes del primer intento los regalaba siempre.
          for i in $(seq 1 60); do
            if curl -fsS -m 10 https://api.elgatobobah.com/readyz | grep -q ready; then
              echo "API lista"; exit 0
            fi
            sleep 5
          done
          echo "La API no respondió /readyz tras 5 min"; exit 1
