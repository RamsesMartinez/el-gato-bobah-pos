# Git hooks (lefthook). Instalar: `make install` o `lefthook install`.
# Rápido y paralelo; corre lo esencial antes de commit/push.

pre-commit:
  parallel: true
  commands:
    go-fmt:
      root: "server/"
      glob: "*.go"
      run: bash ../scripts/hooks/gofmt-staged.sh {staged_files}
    go-lint:
      root: "server/"
      glob: "*.go"
      run: bash ../scripts/hooks/golangci-lint.sh
    web-lint:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: bun run lint && bun run typecheck

pre-push:
  parallel: true
  commands:
    go-test:
      root: "server/"
      run: go test ./...
    go-vuln:
      root: "server/"
      run: bash ../scripts/hooks/govulncheck.sh
    web-build:
      root: "web/"
      run: bun run build
