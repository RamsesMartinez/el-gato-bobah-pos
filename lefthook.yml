# Git hooks (lefthook). Instalar: `make install` o `lefthook install`.
# Rápido y paralelo; corre lo esencial antes de commit/push.

pre-commit:
  parallel: true
  commands:
    go-fmt:
      root: "server/"
      glob: "*.go"
      run: bash ../scripts/hooks/gofmt-staged.sh {staged_files}
    go-lint:
      root: "server/"
      glob: "*.go"
      run: bash ../scripts/hooks/golangci-lint.sh
    web-lint:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: bash ../scripts/hooks/web-lint.sh
    # Una migración nueva sin su test de integración no pasa. La regla ya estaba escrita en la
    # constitución y aun así se rompió: un recordatorio se olvida, un commit que falla no.
    migracion-con-test:
      run: bash scripts/hooks/migracion-con-test.sh
    # Los scripts que borran una base tienen prueba (scripts/tests/): un cambio que los vuelva a
    # apuntar a la base de la carpeta principal desde un worktree no se commitea.
    scripts-test:
      glob: "scripts/{restaurar-respaldo,worktree-env-load}.sh"
      run: bash scripts/tests/restaurar-respaldo-test.sh
    # Cerrar un worktree borra su carpeta, su rama y (con datos=1) su base.
    cerrar-worktree-test:
      glob: "{scripts/{cerrar-worktree,stop,guard-shared-compose,worktree-env-load}.sh,scripts/tests/cerrar-worktree-test.sh,Makefile}"
      run: bash scripts/tests/cerrar-worktree-test.sh
    # El anonimizador se quedó atrás cuando llegaron los pedidos de plataforma: sus cuerpos crudos
    # pasaban a la base de pruebas con la verificación diciendo «0 datos personales».
    respaldo-anonimo-test:
      glob: "{scripts/respaldo-anonimo.sh,scripts/tests/respaldo-anonimo-test.sh,server/migrations/*.sql}"
      run: bash scripts/tests/respaldo-anonimo-test.sh
    nuevo-worktree-test:
      glob: "{scripts/nuevo-worktree.sh,scripts/tests/nuevo-worktree-test.sh,Makefile}"
      run: bash scripts/tests/nuevo-worktree-test.sh
    # El que mueve el tráfico de producción entre los dos lados de la API (spec 041): sus caminos de
    # falla no se ven en una subida que sale bien.
    deploy-azul-verde-test:
      glob: "scripts/{deploy-azul-verde.sh,tests/deploy-azul-verde-test.sh}"
      run: bash scripts/tests/deploy-azul-verde-test.sh
    # Reparte la integración entre los shards de CI (spec 044): una prueba que ningún shard tome no
    # corre en ningún lado y el CI queda verde.
    ci-shard-tests-test:
      glob: "scripts/{ci-shard-tests.sh,tests/ci-shard-tests-test.sh}"
      run: bash scripts/tests/ci-shard-tests-test.sh

pre-push:
  parallel: true
  commands:
    go-test:
      root: "server/"
      run: bash ../scripts/hooks/go-test.sh
    go-vuln:
      root: "server/"
      run: bash ../scripts/hooks/govulncheck.sh
    web-build:
      root: "web/"
      run: bash ../scripts/hooks/web-build.sh
