# Producción (VPS): api + postgres + redis + caddy (TLS + estáticos del frontend).
services:
  api:
    build: ../server
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://gatobobah:${POSTGRES_PASSWORD}@postgres:5432/gatobobah?sslmode=disable
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      LOG_DIR: /logs
    volumes:
      - apilogs:/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatobobah
      POSTGRES_USER: gatobobah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatobobah -d gatobobah"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
  apilogs: {}
