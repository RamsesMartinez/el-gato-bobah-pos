# Producción (VPS): api + postgres + redis + caddy (TLS del subdominio de la API).
# El frontend ya NO se sirve aquí — vive en Cloudflare Pages (ver web/public/_headers).

# Cap de logs para que ningún contenedor llene el disco del VPS.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    # La imagen la compila y publica CI (job `image` en ci.yml) y el VPS solo la BAJA: en un
    # e2-micro de 1 vCPU/1 GB compilar tarda ~30 min y puede morir por OOM. API_IMAGE lo pasa
    # el deploy con el tag del commit exacto; el default sirve para levantar a mano.
    image: ${API_IMAGE:-ghcr.io/ramsesmartinez/el-gato-bobah-pos/api:develop}
    # `build:` se queda para el camino manual (`make build`/`make deploy`): compose lo usa solo
    # cuando se lo pides explícitamente, y etiqueta el resultado como la imagen de arriba.
    build:
      context: ../server
      # Versión del build: la fija `make build` (GIT_SHA/BUILT_AT). Sin ellas → "dev".
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-}
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      # DATABASE_URL = owner (POSTGRES_USER/POSTGRES_DB, ver servicio postgres abajo): migra +
      # bootstrap + fija el password del rol de app.
      DATABASE_URL: postgres://${POSTGRES_USER:-gatobobah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gatobobah}?sslmode=disable
      # APP_DATABASE_URL = rol no-superusuario: sirve requests SUJETO a RLS (aislamiento
      # multi-empresa). Su password lo fija el bootstrap desde APP_DB_PASSWORD. "gatobobah_app"
      # queda fijo a propósito (lo crea por nombre server/migrations/0024_tenant_rls.sql, no es
      # configurable sin tocar esa migración).
      APP_DATABASE_URL: postgres://gatobobah_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gatobobah}?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      LOG_DIR: /logs
      # Recuperación de contraseña por email → Zoho Mail SMTP en producción.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
    volumes:
      - apilogs:/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatobobah}
      POSTGRES_USER: ${POSTGRES_USER:-gatobobah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatobobah} -d ${POSTGRES_DB:-gatobobah}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    # Imagen oficial clavada por digest (A08) — sin build propio: solo reverse-proxy a la
    # API, el Caddyfile entra por bind mount.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    logging: *default-logging
    ports: ["80:80", "443:443"]
    environment:
      # Sin definirlo, el Caddyfile cae en el dominio de producción: el VPS sigue igual y el
      # ambiente de pruebas lo sobrescribe en su .env.
      API_DOMAIN: ${API_DOMAIN:-api.elgatobobah.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
  apilogs: {}
