# Dev: solo postgres + redis con puertos publicados. La API corre en el host con air
# y el frontend con `bun dev` (Vite proxy /api → localhost:8080). Inner loop más rápido.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatobobah
      POSTGRES_USER: gatobobah
      POSTGRES_PASSWORD: gatobobah
    ports: ["5433:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatobobah -d gatobobah"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

volumes:
  pgdata_dev: {}
