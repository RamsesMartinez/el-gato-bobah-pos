# Dev: postgres + redis + mailpit (captura de correos local). La API corre en el host con air
# y el frontend con `bun dev` (Vite proxy /api → localhost:8080). Inner loop más rápido.
#
# Los puertos publicados son env con default: un default fijo, por raro que sea, termina
# chocando con el postgres/redis de otro compose de la misma máquina. scripts/start.sh los
# resuelve (reusa el del contenedor vivo, o el primero libre) y los exporta.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatobobah
      POSTGRES_USER: gatobobah
      POSTGRES_PASSWORD: gatobobah
    ports: ["${PG_PORT:-5490}:5432"]
    volumes: [pgdata_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatobobah -d gatobobah"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6390}:6379"]


  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_HTTP_PORT:-8095}:8025", "${MAILPIT_SMTP_PORT:-1095}:1025"]
    restart: unless-stopped

# Sin red custom: nadie habla contenedor-a-contenedor (la API corre en el host y llega a cada
# servicio por localhost:puerto). Compose crea la red 'default' sola; fijar subred aquí chocaba
# con redes de otros compose del equipo — p.ej. sat_cfdi ocupa 172.28.0.0/16.
volumes:
  pgdata_dev: {}
