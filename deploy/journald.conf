# Se instala en /etc/systemd/journald.conf.d/pos.conf en cada `make deploy-image`.
#
# La bitácora de la API va al journal del host y no al archivo del contenedor: ése se borra cada
# vez que un deploy recrea el contenedor, y con el tope de 30 MB alcanzaba unos 5 días. Por eso no
# se pudo saber desde qué IP se registraron dos ventas del 14 de septiembre de 2026.
[Journal]
# Debian (la VM de pruebas) arranca con el journal en memoria si /var/log/journal no existe.
Storage=persistent
MaxRetentionSec=30day
# Tope de disco por si algo se pone a escribir de más: 30 días de la API se estiman en ~100 MB
# (medido: ~3 MB al día en producción a principios de octubre de 2026).
SystemMaxUse=2G
